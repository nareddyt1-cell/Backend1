<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pancreatic Proenzyme Sequence Analyzer</title>

<style>
body {
    font-family: Arial, sans-serif;
    max-width: 1100px;
    margin: auto;
}

textarea {
    width: 100%;
    height: 220px;
    font-family: monospace;
    white-space: pre-wrap;
    word-break: break-word;
}

button {    
    margin-top: 12px;
    padding: 12px 20px;
    font-size: 16px;
    cursor: pointer;
}

.section {
    margin-top: 30px;
}

.bar-container {
    width: 100%;
    background: #eee;
    border-radius: 6px;
    margin-top: 6px;
}

.bar {
    height: 26px;
    border-radius: 6px;
    text-align: right;
    padding-right: 8px;
    color: white;
    font-weight: bold;
}

.damaged {
    background: #e44;
}

</style>
</head>

<body>

<h1>Pancreatic Proenzyme Sequence Analyzer</h1>
<div class="section">

<h3>UniProtKB Entry Name</h3>
<textarea id="uniprotkb"></textarea>
</div>


<div class="section">
<h3>Damaged Sequence</h3>
<textarea id="damaged"></textarea>
</div>

<button type="button" onclick="analyze()">Analyze Sequence</button>

<div class="section">
<h3>Identified Enzyme</h3>
<div id="enzyme">—</div>
</div>

<div class="section">
<h3>Functional Likelihood (%)</h3>
<label>Damaged Enzyme Sequence</label>
<div class="bar-container">
    <div id="damagedBar" class="bar damaged" style="width:0%">0%</div>
</div>
</div>

<div class="section">
<h3>Changes in Sequence</h3>
<pre id="changes">—</pre>
</div>



<script>
async function analyze() {
    console.log("Analyze button clicked");
    const uniprotkb = document.getElementById("uniprotkb").value.trim();
    const damaged = document.getElementById("damaged").value.trim();
    if (!uniprotkb || !damaged) {
        alert("Please paste both sequences.");
        return;
    }

    try {
        const response = await fetch("https://backend-688r.onrender.com/analyze", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                uniprotkb_id: uniprotkb,
                damaged_sequence: damaged
            })
        });

        const data = await response.json();

        document.getElementById("enzyme").textContent = data.identified_enzyme;
        document.getElementById("damagedBar").style.width = data.damaged_percent + "%";
        document.getElementById("damagedBar").textContent = data.damaged_percent + "%";
        document.getElementById("changes").textContent = data.changes_in_sequence;
            data.changes.map(
                m => `Position ${m.position}: ${m.from} → ${m.to}`
            ).join("\n") || "No changes in amino acids detected.";

    } catch (err) {
        console.error(err);
        alert("Backend connection failed");
    }
}
</script>

</body>
</html>
